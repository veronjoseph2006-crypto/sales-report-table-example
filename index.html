<!DOCTYPE html>
<html>
    <head><title>Sales Report</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
       <table>
        <tr class="headings">
            <th>Month</th>
            <th>Number of Sales</th>
            <th>Amount</th>
        </tr>
        <tr>
            <th class="Jan">January</th>
            <td>105</td>
            <td>$15,000</td>
        </tr>
        <tr>
            <th class="Feb">February</th>
            <td>95</td>
            <td>$12,000</td>
        </tr>
        <tr>
            <th>March</th>
            <td class="Mar">150</td>
            <td>$20,000</td>
        </tr>
        <tr>
            <th>April</th>
            <td>50</td>
            <td class="Apr">$30,000</td>
        </tr>
        <tr>
            <th>May</th>
            <td class="May">80</td>
            <td>$15,000</td>
        </tr>
        <tr>
            <th>June</th>
            <td>110</td>
            <td class="June">$22,000</td>
        </tr>
        <tr>
            <th colspan="2" class="Grand">Grand Total</th>
            <td class="total">$114,000</td>
        </tr>
       </table>
    </body>
</html>
